<!doctype html>
<html lang="en">
  <head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>MQSF 2026 — Summary and Recordings</title>
    <meta
      name="description"
      content="Look back at the Munich Quantum Software Forum 2026."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      sizes="any"
      href="assets/images/brand/logo-q-light.svg?v=1"
    />
    <script>
      const hash = location.hash;
      if (["#program", "#day-1", "#day-2", "#side-events"].includes(hash)) {
        location.replace(
          "2026/program/" + location.search + (hash === "#program" ? "" : hash),
        );
      } else {
        location.replace(
          "2026/" +
            location.search +
            (hash === "#registration" ? "#overview" : hash),
        );
      }
    </script>
    <noscript
      ><meta
        http-equiv="refresh"
        content="0; url=2026/"
    /></noscript>
  </head>
  <body>
    <p><a href="2026/">MQSF 2026 summary and recordings</a>.</p>
    <p><a href="2026/program/">2026 program and meet-ups</a>.</p>
  </body>
</html>
